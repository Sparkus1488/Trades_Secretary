services:
  - type: web
    name: trades-secretary-private-beta
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: trades-secretary-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "4242"
      - key: SITEPIX_DATA_DIR
        value: /var/data
      - key: SITEPIX_BETA_INVITE_CODE
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
        
