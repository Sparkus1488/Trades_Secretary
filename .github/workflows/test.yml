name: Trades Secretary tests

on:
  push:
    branches:
      - corrected-release-0.4.2
  pull_request:
    branches:
      - corrected-release-0.4.2
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
