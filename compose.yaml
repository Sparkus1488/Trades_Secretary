services:
  sitepix-ai:
    build: .
    ports:
      - "4242:4242"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SITEPIX_BETA_INVITE_CODE: ${SITEPIX_BETA_INVITE_CODE:-}
      PORT: 4242
      SITEPIX_DATA_DIR: /app/data
      SITEPIX_BASE_URL: ${SITEPIX_BASE_URL:-http://localhost:4242}
      SITEPIX_DEMO_BUSINESS_NAME: ${SITEPIX_DEMO_BUSINESS_NAME:-our construction team}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SOLO: ${STRIPE_PRICE_SOLO:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_MEASURE_BID: ${STRIPE_PRICE_MEASURE_BID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_INCOMING_WEBHOOK_URL: ${TWILIO_INCOMING_WEBHOOK_URL:-}
      TWILIO_RECORDING_CALLBACK_URL: ${TWILIO_RECORDING_CALLBACK_URL:-}
      TWILIO_VOICE_TURN_WEBHOOK_URL: ${TWILIO_VOICE_TURN_WEBHOOK_URL:-}
      TWILIO_HANDOFF_WEBHOOK_URL: ${TWILIO_HANDOFF_WEBHOOK_URL:-}
      SITEPIX_HUMAN_HANDOFF_NUMBER: ${SITEPIX_HUMAN_HANDOFF_NUMBER:-}
      TWILIO_ORGANIZATION_ID: ${TWILIO_ORGANIZATION_ID:-}
      TWILIO_NUMBER_ORG_MAP: ${TWILIO_NUMBER_ORG_MAP:-}
      DATABASE_URL: ${DATABASE_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
    volumes:
      - sitepix_data:/app/data
    restart: unless-stopped
volumes:
  sitepix_data:
