# Free sandbox deployment for testing only.
# Filesystem is ephemeral: test accounts, records, and uploads may disappear on restart, spin-down, or redeploy.
# Use synthetic data only. This is not a production deployment.
services:
  - type: web
    name: trades-secretary-sandbox
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "4242"
      - key: SITEPIX_DATA_DIR
        value: /app/data
      - key: SITEPIX_BETA_INVITE_CODE
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
